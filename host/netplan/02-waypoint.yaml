# Waypoint-Host (alter Laptop, Ubuntu Server 24.04): Interface-Konfiguration
# host/netplan/02-waypoint.yaml -> /etc/netplan/02-waypoint.yaml (via host/install.sh)
#
# Angepasst an die echte Hardware (Ausgabe von 'ip a'):
#   - wlo1 = WLAN      = Seite A (Heim-/Campus-Netz, Default-Route, DHCP)
#   - eno1 = Ethernet  = Seite B (geschütztes Dienste-Netz, statisch, NIE Default-Route)
#
# Regeln:
#  - Genau EINE Default-Route: Seite A (wlo1).
#  - Seite B bekommt NIE eine Default-Route, sonst leitet der Waypoint
#    den Verkehr der Dienste ins Campus-Netz.
#  - Zugangsdaten (SSID/Passwort) bewusst NICHT ins Repo: nach dem Kopieren
#    auf dem Host in /etc/netplan/02-waypoint.yaml eintragen (Berechtigung 0600).
network:
  version: 2
  ethernets:
    eno1:
      addresses: [192.168.30.1/24]   # Seite B: geschütztes Dienste-Netz (statisch)
      # Bewusst KEINE routes-Sektion: keine Default-Route auf Seite B.
  wifis:
    wlo1:
      dhcp4: true                    # Seite A: Heim-/Campus-Netz
      access-points:
        "SSID-HIER-EINTRAGEN":       # auf dem Host ausfüllen, nicht committen
          password: "PASSWORT-HIER-EINTRAGEN"
