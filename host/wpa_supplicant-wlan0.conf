# Waypoint-Host: WLAN auf Seite A für 802.1X-Netzwerke (z. B. eduroam)
# host/wpa_supplicant-wlan0.conf -> /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#
# Nur verwenden, wenn Seite A per WLAN angebunden ist (Leitfaden Abschnitt 3.4).
# Zugangsdaten und CA-Zertifikat vor Verwendung ersetzen — Datei enthält Credentials,
# daher Berechtigung 0600 und NICHT committen (Platzhalter im Repo).
ctrl_interface=/run/wpa_supplicant

network={
    ssid="eduroam"
    key_mgmt=WPA-EAP
    eap=PEAP
    phase2="auth=MSCHAPV2"
    identity="studi@hs.example"
    password="CHANGEME"
    ca_cert="/etc/wpa_supplicant/hs-ca.pem"
}
